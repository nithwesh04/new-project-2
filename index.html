<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian States Project</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; color: #222; }
header { background: linear-gradient(120deg, #ff9933, #fff, #138808); text-align: center; padding: 30px 15px; }
header h1 { margin: 0; }
.container { max-width: 1000px; margin: auto; padding: 20px; }
.states { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
.state { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 7px #0002; text-align: center; }
.state h3 { margin: 0; }
.done { border-bottom: 4px solid #138808; cursor: pointer; }
footer { text-align: center; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>🇮🇳 Incredible India</h1>
  <p>Explore the States of India</p>
</header>
<div class="container"><div class="states" id="states"></div></div>
<footer>Made with ❤️ for our School Project<h3>JAI HIND 🇮🇳</h3></footer>
<script>
// Replace these six sample names with the six states you have completed.
const completedStates = [
  "Andhra Pradesh", "Telangana", "Karnataka",
  "Kerala", "Tamil Nadu", "Maharashtra"
];
const allStates = [
  "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar",
  "Chhattisgarh", "Goa", "Gujarat", "Haryana", "Himachal Pradesh",
  "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh",
  "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland",
  "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu",
  "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"
];
const area = document.getElementById("states");
allStates.forEach(name => {
  const card = document.createElement("div");
  if (completedStates.includes(name)) {
    card.className = "state done";
    card.innerHTML = `<h3>${name}</h3>`;
    card.onclick = () => alert("Connect your existing information page for " + name);
  } else {
    card.className = "state";
    card.innerHTML = `<h3>${name}</h3>`;
  }
  area.appendChild(card);
});
</script>
</body>
</html>
